# Lancement local ou sur un serveur : docker compose up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zouti
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zouti}
      POSTGRES_DB: zouti
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zouti"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://zouti:${POSTGRES_PASSWORD:-zouti}@db:5432/zouti
      APP_URL: ${APP_URL:-http://localhost:3000}

  # Tâches planifiées (expirations, rappels, versements) toutes les 15 minutes.
  cron:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    depends_on:
      - app
    env_file:
      - path: .env
        required: false
    entrypoint: ["sh", "-c", "while true; do sleep 900; curl -fsS -H \"Authorization: Bearer $$CRON_SECRET\" http://app:3000/api/cron || true; done"]

volumes:
  pgdata:
