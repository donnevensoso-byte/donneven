# Déploiement Render (région Francfort, UE) : web service Docker, Postgres géré, tâche planifiée.
# Dans Render : New > Blueprint > ce dépôt. Les valeurs « sync: false » sont demandées à l'import.
services:
  - type: web
    name: zouti
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: zouti-db
          property: connectionString
      - key: APP_URL
        sync: false # https://votre-domaine (sans / final)
      - key: ADMIN_EMAILS
        sync: false
      - key: CRON_SECRET
        generateValue: true
      # Identité légale affichée dans les mentions légales, CGU et confidentialité
      - key: CONTACT_EMAIL
        sync: false
      - key: LEGAL_PUBLISHER
        sync: false # Prénom Nom EI
      - key: LEGAL_ADDRESS
        sync: false
      - key: LEGAL_SIRET
        sync: false
      - key: LEGAL_MEDIATOR
        sync: false
      - key: TRUSTED_PROXIES
        value: "1"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false # ex. Zouti <bonjour@votre-domaine>
      # Paiement en ligne : laisser vide au lancement (tout se règle en main propre).
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SERVICE_FEE_PERCENT
        value: "10"

  # Expirations, rappels aux propriétaires, versements en échec : toutes les 15 minutes.
  - type: cron
    name: zouti-cron
    runtime: docker
    region: frankfurt
    plan: starter
    schedule: "*/15 * * * *"
    dockerfilePath: ./scripts/cron.Dockerfile
    envVars:
      - key: CRON_SECRET
        fromService:
          name: zouti
          type: web
          envVarKey: CRON_SECRET
      - key: APP_URL
        sync: false

databases:
  - name: zouti-db
    databaseName: zouti
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "16"
